<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洁斌视频工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- 图标精灵：内联 SVG，离线也有得用 -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-3.5v11L16 14z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 4 4 3-2 4 4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6m0-6-2.4 2.4M12 11l2.4 2.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 9v5M12 17.2v.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M15 6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4 3 7.5 7 9 4-1.5 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M4.5 7.5l2.8 2.8M16.7 13.7l2.8 2.8M3 12h4M17 12h4M4.5 16.5l2.8-2.8M16.7 10.3l2.8-2.8"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m7 10 2.5 2L7 14M12.5 14h4"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 4v5h6V4M8 20v-5h8v5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 5v4h4"/><path d="M12 8v4.6l3.2 2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v6h6"/><path d="M3.5 14a8.5 8.5 0 1 0 2-8.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
</svg>

<div class="app">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar glass">
    <div class="brand">
      <div class="logo"><svg><use href="#i-play"/></svg></div>
      <div class="brand-txt">
        <b>洁斌视频工作台</b>
        <span>AI VIDEO STUDIO · LOCAL</span>
      </div>
    </div>

    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="globalSearch" type="text" placeholder="搜 IP / 套次 / 脚本 / 文件…" autocomplete="off">
      <span class="kbd">/</span>
    </div>

    <div class="spacer"></div>

    <div class="services" id="svcBar"></div>

    <button class="btn icon" id="btnSettings" title="设置（右栏 · 两层两类参数）">
      <svg><use href="#i-gear"/></svg>
    </button>
    <button class="btn icon" id="btnDensity" title="紧凑 / 舒适密度（只改留白，不是设置）">
      <svg><use href="#i-sliders"/></svg>
    </button>
    <button class="btn icon" id="btnRefresh" title="刷新全部（F5）">
      <svg><use href="#i-refresh"/></svg>
    </button>
  </header>

  <!-- ===== 主体 ===== -->
  <div class="main">

    <!-- 左栏 -->
    <aside class="col col-left" id="colLeft">
      <section class="panel glass" data-panel="tree">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#7c6cff"><use href="#i-folder"/></svg> IP 与套次</h3>
          <span class="sub" id="treeCount"></span>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner">
          <div class="filter-row" id="tagFilter"></div>
          <div id="ipTree"></div>
          <button class="btn sm" id="btnNewCard" style="width:100%;margin-top:8px;justify-content:center">
            <svg><use href="#i-plus"/></svg> 新建档案卡（接新客户）
          </button>
        </div></div>
      </section>

      <section class="panel glass" data-panel="scripts">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#35d6d0"><use href="#i-term"/></svg> 生产脚本</h3>
          <span class="sub" id="scriptCount"></span>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="scriptList"></div></div>
      </section>

      <section class="panel glass" data-panel="deviation">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#ffb457"><use href="#i-alert"/></svg> 脚本偏离</h3>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="deviationBox">
          <div class="empty">点「刷新」比对各 IP 脚本与引擎真源的差异</div>
        </div></div>
      </section>
    </aside>

    <div class="split split-l" data-side="left"></div>

    <!-- 中栏 -->
    <main class="col col-mid" id="colMid">
      <div class="hero glass" id="hero"></div>

      <section class="panel glass" data-panel="overview">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#3ddc97"><use href="#i-check"/></svg> 进度与自检</h3>
          <span class="sub" id="guardSub"></span>
          <div class="panel-actions">
            <button class="btn sm" id="btnGuard"><svg><use href="#i-shield"/></svg> 跑自检</button>
          </div>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="overviewBox"></div></div>
      </section>

      <section class="panel glass" data-panel="files">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#7c6cff"><use href="#i-image"/></svg> 素材与成片</h3>
          <span class="sub" id="filesPath"></span>
          <div class="panel-actions">
            <button class="btn sm" id="btnUp"><svg><use href="#i-up"/></svg> 上级</button>
          </div>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="filesBox"></div></div>
      </section>

      <section class="panel glass" data-panel="brief">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#ffd166"><use href="#i-mic"/></svg> 需求台（开工前先说清）</h3>
          <span class="sub" id="briefSub"></span>
          <div class="panel-actions">
            <button class="btn sm" id="btnBriefSave"><svg><use href="#i-save"/></svg> 存需求</button>
          </div>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="briefBox"></div></div>
      </section>

      <section class="panel glass" data-panel="prompts">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#ff6cf0"><use href="#i-spark"/></svg> 提示词</h3>
          <span class="sub" id="promptsSub"></span>
          <div class="panel-actions">
            <button class="btn sm" id="btnCmdOpt"><svg><use href="#i-spark"/></svg> AI 优化</button>
            <button class="btn sm" id="btnCmdGen"><svg><use href="#i-plus"/></svg> AI 生成</button>
          </div>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="promptsBox"></div></div>
      </section>

      <section class="panel glass" data-panel="cmd">
        <div class="panel-head">
          <h3><svg class="ico" style="width:13px;height:13px;color:#58a6ff"><use href="#i-term"/></svg> 命令（出片类回终端跑）</h3>
          <svg class="caret"><use href="#i-chev"/></svg>
        </div>
        <div class="panel-body"><div class="inner" id="cmdBox"></div></div>
      </section>
    </main>

    <div class="split split-r" data-side="right"></div>

    <!-- 右栏 -->
    <aside class="col col-right" id="colRight">
      <div class="tabs" id="rightTabs">
        <div class="tab on" data-tab="inspect">检查</div>
        <div class="tab" data-tab="settings">设置</div>
        <div class="tab" data-tab="log">变更记录</div>
      </div>

      <div id="tabInspect"></div>
      <div id="tabSettings" style="display:none"></div>
      <div id="tabLog" style="display:none"></div>
    </aside>
  </div>
</div>

<div id="toasts"></div>

<!-- ===== 运行面板：真跑 + 日志实时看 + 能停 =====
     界面以前只给命令让人回终端跑，理由是「怕你看不见它死在哪」。
     现在反过来：正因为要看见，才把它放到界面上 —— 日志就在这儿，一行不落。 -->
<div class="runpanel glass" id="runPanel">
  <div class="run-head">
    <span class="dot run-dot" id="runDot"></span>
    <b id="runLabel">运行</b>
    <span class="run-sub" id="runSub"></span>
    <div class="spacer"></div>
    <button class="btn icon sm" id="runCopy" title="复制这条命令（想回终端跑也行）"><svg><use href="#i-copy"/></svg></button>
    <button class="btn icon sm" id="runMin" title="收起 / 展开日志"><svg><use href="#i-chev"/></svg></button>
    <button class="btn icon sm" id="runClose" title="关闭面板（后台任务不会被关掉）"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="run-cmd mono" id="runCmd"></div>
  <pre class="run-log" id="runLog"></pre>
  <div class="run-foot">
    <span class="hint" id="runHint"></span>
    <div class="spacer"></div>
    <button class="btn sm ghost" id="runHist" title="看之前跑过什么、结果如何">最近跑过</button>
    <button class="btn sm danger ghost" id="runStop">停止</button>
    <button class="btn sm" id="runAgain">再跑一次</button>
  </div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal glass" id="modalBox"></div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
